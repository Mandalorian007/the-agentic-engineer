name: Secret scan

# Fails any push or PR that adds a credential (webhook URLs, API keys, tokens).
# Rules: .gitleaks.toml. Real values belong in .env.local, Vercel, or Actions secrets.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BASE..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          ./gitleaks git --config .gitleaks.toml --log-opts="$RANGE" --redact --verbose
